<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arizona Store</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f5f5;
  color:#171717;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:#111;
  color:white;
  padding:15px 20px;
}

.header{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:25px;
  font-weight:800;
}

.cart-btn{
  border:0;
  background:#f5b400;
  color:#111;
  padding:11px 16px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.hero{
  background:linear-gradient(135deg,#111,#444);
  color:white;
  padding:55px 20px;
  text-align:center;
}

.hero h1{
  margin:0 0 12px;
  font-size:clamp(35px,7vw,65px);
}

.hero p{
  margin:0;
  font-size:18px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:30px 20px;
}

.controls{
  background:white;
  padding:18px;
  border-radius:14px;
  margin-bottom:25px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.controls-grid{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:12px;
}

input,select{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
  background:white;
}

.results{
  margin:15px 0;
  color:#666;
}

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.product{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.product-image{
  width:100%;
  height:210px;
  object-fit:cover;
  display:block;
  background:#ddd;
}

.product-body{
  padding:16px;
}

.category{
  color:#777;
  font-size:13px;
  margin-bottom:7px;
}

.product h3{
  margin:0 0 8px;
  font-size:19px;
}

.description{
  color:#666;
  font-size:14px;
  line-height:1.4;
  min-height:40px;
}

.price{
  font-size:21px;
  font-weight:bold;
  margin:14px 0;
}

.add{
  width:100%;
  border:0;
  background:#111;
  color:white;
  padding:12px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.add:hover{
  background:#333;
}

.pagination{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin:30px 0;
  flex-wrap:wrap;
}

.pagination button{
  border:1px solid #ccc;
  background:white;
  padding:9px 13px;
  border-radius:7px;
  cursor:pointer;
}

.pagination button.active{
  background:#111;
  color:white;
}

.pagination button:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.cart-panel{
  display:none;
  position:fixed;
  right:0;
  top:0;
  height:100vh;
  width:min(450px,100%);
  background:white;
  z-index:200;
  box-shadow:-5px 0 25px rgba(0,0,0,.2);
  overflow-y:auto;
  padding:22px;
}

.cart-panel.show{
  display:block;
}

.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.close{
  border:0;
  background:#eee;
  border-radius:50%;
  width:38px;
  height:38px;
  font-size:22px;
  cursor:pointer;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:15px 0;
  border-bottom:1px solid #ddd;
}

.cart-item-info{
  flex:1;
}

.cart-item-name{
  font-weight:bold;
}

.quantity{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px;
}

.quantity button{
  border:0;
  background:#eee;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}

.remove{
  color:#b00020;
  border:0;
  background:none;
  cursor:pointer;
  margin-top:7px;
}

.cart-total{
  font-size:23px;
  font-weight:bold;
  text-align:right;
  margin:25px 0;
}

.checkout{
  border-top:1px solid #ddd;
  padding-top:20px;
}

.checkout h3{
  margin-bottom:15px;
}

.checkout input,
.checkout textarea{
  margin-bottom:11px;
}

textarea{
  width:100%;
  min-height:90px;
  padding:13px;
  border:1px solid #ccc;
  border-radius:8px;
  font-family:inherit;
  resize:vertical;
}

.order-btn{
  width:100%;
  padding:15px;
  border:0;
  border-radius:8px;
  background:#f5b400;
  color:#111;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}

.empty{
  text-align:center;
  color:#777;
  padding:30px 10px;
}

.message{
  margin-top:15px;
  padding:15px;
  border-radius:8px;
  display:none;
  line-height:1.5;
}

.success{
  background:#e6f7e6;
  color:#176b17;
}

.error{
  background:#ffe8e8;
  color:#a00000;
}

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:150;
}

.overlay.show{
  display:block;
}

footer{
  background:#111;
  color:white;
  text-align:center;
  padding:30px 20px;
  margin-top:50px;
}

@media(max-width:950px){
  .products{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:700px){
  .products{
    grid-template-columns:repeat(2,1fr);
  }

  .controls-grid{
    grid-template-columns:1fr;
  }

  .product-image{
    height:180px;
  }
}

@media(max-width:450px){
  .products{
    grid-template-columns:1fr;
  }

  .product-image{
    height:220px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header">

    <div class="logo">
      Arizona Store
    </div>

    <button class="cart-btn" onclick="openCart()">
      🛒 Cart (<span id="cartCount">0</span>)
    </button>

  </div>
</header>

<section class="hero">

  <h1>Arizona Online Store</h1>

  <p>
    Discover products, add them to your cart and place your order.
  </p>

</section>

<main class="container">

  <div class="controls">

    <div class="controls-grid">

      <input
        id="search"
        type="search"
        placeholder="Search products..."
        oninput="applyFilters()"
      >

      <select
        id="category"
        onchange="applyFilters()"
      >
        <option value="">All categories</option>
      </select>

    </div>

  </div>

  <div class="results">
    Showing <strong id="resultCount">0</strong> products
  </div>

  <div id="products" class="products">
    <div class="empty">
      Loading products...
    </div>
  </div>

  <div id="pagination" class="pagination"></div>

</main>

<div
  id="overlay"
  class="overlay"
  onclick="closeCart()"
></div>

<aside id="cartPanel" class="cart-panel">

  <div class="cart-header">

    <h2>Your Cart</h2>

    <button
      class="close"
      onclick="closeCart()"
    >
      ×
    </button>

  </div>

  <div id="cartItems"></div>

  <div class="cart-total">
    Total: $<span id="cartTotal">0.00</span>
  </div>

  <div class="checkout">

    <h3>Place Your Order</h3>

    <input
      id="customerName"
      type="text"
      placeholder="Full name"
    >

    <input
      id="customerEmail"
      type="email"
      placeholder="Email address"
    >

    <input
      id="customerPhone"
      type="tel"
      placeholder="Phone number"
    >

    <textarea
      id="customerAddress"
      placeholder="Delivery address"
    ></textarea>

    <button
      class="order-btn"
      onclick="placeOrder()"
    >
      Place Order
    </button>

    <div id="message" class="message"></div>

  </div>

</aside>

<footer>
  © 2026 Arizona Store
</footer>

<script>

let products = [];
let filteredProducts = [];
let cart = [];

let currentPage = 1;

const productsPerPage = 24;


/* ================================
   LOAD PRODUCTS
================================ */

async function loadProducts(){

  const container =
    document.getElementById("products");

  try{

    const response =
      await fetch("products.json");

    if(!response.ok){
      throw new Error("Could not load products.");
    }

    products =
      await response.json();

    if(!Array.isArray(products)){
      throw new Error("Invalid products file.");
    }

    filteredProducts =
      [...products];

    createCategories();

    renderProducts();

    updateCart();

  }catch(error){

    console.error(error);

    container.innerHTML = `
      <div class="empty">
        <strong>Products could not be loaded.</strong>
        <br><br>
        Make sure <b>products.json</b> exists in the
        same repository as this page.
      </div>
    `;

  }

}


/* ================================
   CATEGORIES
================================ */

function createCategories(){

  const select =
    document.getElementById("category");

  const categories =
    [...new Set(
      products
        .map(product => product.category)
        .filter(Boolean)
    )]
    .sort();

  select.innerHTML =
    `<option value="">All categories</option>`;

  categories.forEach(category => {

    const option =
      document.createElement("option");

    option.value = category;

    option.textContent = category;

    select.appendChild(option);

  });

}


/* ================================
   FILTER
================================ */

function applyFilters(){

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  const category =
    document
      .getElementById("category")
      .value;

  filteredProducts =
    products.filter(product => {

      const matchesSearch =
        !search ||
        String(product.name || "")
          .toLowerCase()
          .includes(search) ||
        String(product.description || "")
          .toLowerCase()
          .includes(search) ||
        String(product.category || "")
          .toLowerCase()
          .includes(search);

      const matchesCategory =
        !category ||
        product.category === category;

      return (
        matchesSearch &&
        matchesCategory
      );

    });

  currentPage = 1;

  renderProducts();

}


/* ================================
   DISPLAY PRODUCTS
================================ */

function renderProducts(){

  const container =
    document.getElementById("products");

  const count =
    document.getElementById("resultCount");

  count.textContent =
    filteredProducts.length.toLocaleString();

  if(filteredProducts.length === 0){

    container.innerHTML = `
      <div class="empty">
        No products found.
      </div>
    `;

    renderPagination();

    return;

  }

  const start =
    (currentPage - 1) *
    productsPerPage;

  const end =
    start + productsPerPage;

  const pageProducts =
    filteredProducts.slice(start,end);

  container.innerHTML =
    pageProducts.map(product => `

      <article class="product">

        <img
          class="product-image"
          src="${escapeHTML(product.image || "")}"
          alt="${escapeHTML(product.name || "Product")}"
          loading="lazy"
          onerror="this.style.display='none'"
        >

        <div class="product-body">

          <div class="category">
            ${escapeHTML(product.category || "Product")}
          </div>

          <h3>
            ${escapeHTML(product.name || "Unnamed Product")}
          </h3>

          <div class="description">
            ${escapeHTML(product.description || "")}
          </div>

          <div class="price">
            $${Number(product.price || 0).toFixed(2)}
          </div>

          <button
            class="add"
            onclick="addToCart(${Number(product.id)})"
          >
            Add to Cart
          </button>

        </div>

      </article>

    `).join("");

  renderPagination();

}


/* ================================
   PAGINATION
================================ */

function renderPagination(){

  const pagination =
    document.getElementById("pagination");

  const totalPages =
    Math.ceil(
      filteredProducts.length /
      productsPerPage
    );

  if(totalPages <= 1){

    pagination.innerHTML = "";

    return;

  }

  let html = "";

  html += `
    <button
      onclick="changePage(${currentPage - 1})"
      ${currentPage === 1 ? "disabled" : ""}
    >
      Previous
    </button>
  `;

  const maxButtons = 7;

  let start =
    Math.max(
      1,
      currentPage - 3
    );

  let end =
    Math.min(
      totalPages,
      start + maxButtons - 1
    );

  if(end - start < maxButtons - 1){

    start =
      Math.max(
        1,
        end - maxButtons + 1
      );

  }

  for(let i = start; i <= end; i++){

    html += `
      <button
        class="${i === currentPage ? "active" : ""}"
        onclick="changePage(${i})"
      >
        ${i}
      </button>
    `;

  }

  html += `
    <button
      onclick="changePage(${currentPage + 1})"
      ${currentPage === totalPages ? "disabled" : ""}
    >
      Next
    </button>
  `;

  pagination.innerHTML = html;

}


function changePage(page){

  const totalPages =
    Math.ceil(
      filteredProducts.length /
      productsPerPage
    );

  if(
    page < 1 ||
    page > totalPages
  ){
    return;
  }

  currentPage = page;

  renderProducts();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* ================================
   CART
================================ */

function addToCart(productId){

  const product =
    products.find(
      item =>
        Number(item.id) ===
        Number(productId)
    );

  if(!product){
    return;
  }

  const existing =
    cart.find(
      item =>
        Number(item.id) ===
        Number(productId)
    );

  if(existing){

    existing.quantity++;

  }else{

    cart.push({
      id: product.id,
      name: product.name,
      price: Number(product.price) || 0,
      image: product.image || "",
      quantity: 1
    });

  }

  updateCart();

  openCart();

}


function changeQuantity(id, amount){

  const item =
    cart.find(
      product =>
        Number(product.id) ===
        Number(id)
    );

  if(!item){
    return;
  }

  item.quantity += amount;

  if(item.quantity <= 0){

    cart =
      cart.filter(
        product =>
          Number(product.id) !==
          Number(id)
      );

  }

  updateCart();

}


function removeFromCart(id){

  cart =
    cart.filter(
      item =>
        Number(item.id) !==
        Number(id)
    );

  updateCart();

}


function updateCart(){

  const count =
    cart.reduce(
      (total,item) =>
        total + item.quantity,
      0
    );

  document
    .getElementById("cartCount")
    .textContent = count;


  const items =
    document.getElementById("cartItems");

  if(cart.length === 0){

    items.innerHTML = `
      <div class="empty">
        Your cart is empty.
      </div>
    `;

    document
      .getElementById("cartTotal")
      .textContent = "0.00";

    return;

  }


  let total = 0;

  items.innerHTML =
    cart.map(item => {

      const itemTotal =
        item.price *
        item.quantity;

      total += itemTotal;

      return `

        <div class="cart-item">

          <div class="cart-item-info">

            <div class="cart-item-name">
              ${escapeHTML(item.name)}
            </div>

            <div>
              $${item.price.toFixed(2)}
            </div>

            <div class="quantity">

              <button
                onclick="changeQuantity(${Number(item.id)},-1)"
              >
                −
              </button>

              <strong>
                ${item.quantity}
              </strong>

              <button
                onclick="changeQuantity(${Number(item.id)},1)"
              >
                +
              </button>

            </div>

            <button
              class="remove"
              onclick="removeFromCart(${Number(item.id)})"
            >
              Remove
            </button>

          </div>

          <strong>
            $${itemTotal.toFixed(2)}
          </strong>

        </div>

      `;

    }).join("");


  document
    .getElementById("cartTotal")
    .textContent =
      total.toFixed(2);

}


/* ================================
   CART OPEN / CLOSE
================================ */

function openCart(){

  document
    .getElementById("cartPanel")
    .classList.add("show");

  document
    .getElementById("overlay")
    .classList.add("show");

}


function closeCart(){

  document
    .getElementById("cartPanel")
    .classList.remove("show");

  document
    .getElementById("overlay")
    .classList.remove("show");

}


/* ================================
   PLACE ORDER
================================ */

function placeOrder(){

  if(cart.length === 0){

    showMessage(
      "Please add a product to your cart first.",
      "error"
    );

    return;

  }


  const name =
    document
      .getElementById("customerName")
      .value
      .trim();

  const email =
    document
      .getElementById("customerEmail")
      .value
      .trim();

  const phone =
    document
      .getElementById("customerPhone")
      .value
      .trim();

  const address =
    document
      .getElementById("customerAddress")
      .value
      .trim();


  if(!name || !email || !phone || !address){

    showMessage(
      "Please complete your name, email, phone number and delivery address.",
      "error"
    );

    return;

  }


  const total =
    cart.reduce(
      (sum,item) =>
        sum +
        item.price *
        item.quantity,
      0
    );


  const orderNumber =
    "AZ-" +
    Date.now();


  const order = {

    orderNumber,

    customer:{
      name,
      email,
      phone,
      address
    },

    items:
      cart.map(item => ({
        id:item.id,
        name:item.name,
        price:item.price,
        quantity:item.quantity
      })),

    total,

    createdAt:
      new Date().toISOString()

  };


  /*
    CURRENTLY THIS IS A FRONTEND DEMO.

    The order is saved locally in the
    customer's browser.

    The next stage will connect this
    to a real backend/database so
    YOU can receive orders.
  */

  localStorage.setItem(
    "arizonaLastOrder",
    JSON.stringify(order)
  );


  showMessage(
    `
      <strong>Order received!</strong><br><br>

      Order number:
      <strong>${orderNumber}</strong><br>

      Total:
      <strong>$${total.toFixed(2)}</strong><br><br>

      Your order has been recorded.
    `,
    "success"
  );


  cart = [];

  updateCart();

}


/* ================================
   MESSAGE
================================ */

function showMessage(text,type){

  const message =
    document.getElementById("message");

  message.className =
    "message " + type;

  message.innerHTML = text;

  message.style.display = "block";

}


/* ================================
   BASIC HTML ESCAPING
================================ */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* ================================
   START
================================ */

loadProducts();

</script>

</body>
</html>
